[workspace]
members = ["crates/behavior-models", "crates/behavior-py"]
resolver = "3"

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# The only core dependency: the public API of the Core Release declared in core-release.json,
# pinned by its exact commit (feature 011, FR-007, FR-017). scripts/check-core-pin.sh keeps the
# three in step.
behavior-engine = { git = "https://github.com/kallistoteles/behavior-ir-core", rev = "63a8c164523275e06ac1d7dc5330db4a899c9d99" }
