[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "behavior"
dynamic = ["version"]
requires-python = ">=3.13"
description = "Python authoring layer for the verifiable Behavior IR"

[project.scripts]
behavior = "behavior._cli:main"

[tool.maturin]
python-source = "python"
module-name = "behavior._engine"
manifest-path = "crates/behavior-py/Cargo.toml"
# The core's command-line tool, staged by scripts/stage-cli.sh (feature 011, FR-018).
include = [{ path = "python/behavior/_bin/behavior", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["python/behavior"]
